name: Metrics

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * 1,4" # lundi et jeudi, plutôt que chaque jour
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # branche latest au 2026-11-01
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Antgst
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
