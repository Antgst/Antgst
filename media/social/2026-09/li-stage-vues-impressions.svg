<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#F6F4EE"/><text x="90" y="125" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#1E1E1E">Documenter mon stage</text><text x="90" y="175" font-family="Arial, sans-serif" font-size="30" fill="#555">et voir progressivement la trace grandir</text><g font-family="Arial, sans-serif"><rect x="100" y="270" width="430" height="110" rx="20" fill="#FFF" stroke="#C8C8C8" stroke-width="2"/><text x="130" y="315" font-size="28" font-weight="700" fill="#222">Ticket</text><text x="130" y="352" font-size="23" fill="#666">un bug compris</text><rect x="100" y="420" width="430" height="110" rx="20" fill="#FFF" stroke="#C8C8C8" stroke-width="2"/><text x="130" y="465" font-size="28" font-weight="700" fill="#222">Apprentissage</text><text x="130" y="502" font-size="23" fill="#666">un outil découvert</text><rect x="100" y="570" width="430" height="110" rx="20" fill="#FFF" stroke="#C8C8C8" stroke-width="2"/><text x="130" y="615" font-size="28" font-weight="700" fill="#222">Retour d’expérience</text><text x="130" y="652" font-size="23" fill="#666">une petite victoire</text></g><path d="M565 485 H790" stroke="#333" stroke-width="7" fill="none"/><path d="M790 485 L760 466 L760 504 Z" fill="#333"/><rect x="830" y="255" width="470" height="445" rx="28" fill="#FFF" stroke="#BEBEBE" stroke-width="2"/><text x="880" y="315" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">Vues / impressions</text><text x="880" y="355" font-family="Arial, sans-serif" font-size="23" fill="#666">progression observée</text><path d="M890 610 H1240 M890 410 V610" stroke="#AAA" stroke-width="3" fill="none"/><polyline points="900,585 960,570 1020,555 1080,525 1140,500 1200,460" fill="none" stroke="#2D6E4B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g fill="#2D6E4B"><circle cx="900" cy="585" r="7"/><circle cx="960" cy="570" r="7"/><circle cx="1020" cy="555" r="7"/><circle cx="1080" cy="525" r="7"/><circle cx="1140" cy="500" r="7"/><circle cx="1200" cy="460" r="7"/></g><text x="90" y="810" font-family="Arial, sans-serif" font-size="28" fill="#444">Pas de formule magique : juste des choses réelles, documentées régulièrement.</text></svg>